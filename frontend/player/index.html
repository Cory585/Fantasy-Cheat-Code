<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='16' rx='14' ry='9' fill='%237a4422'/%3E%3Cpath d='M10 16h12M13 14v4M16 14v4M19 14v4' stroke='%23fff' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/lenis.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="/theme-boot.js"></script>
</head>
<body>
  <a class="skip-link" href="#profile">Skip to content</a>
  <nav class="site-nav" aria-label="Main">
    <div class="site-nav-inner">
      <a class="site-name" href="/">Fantasy Cheat Code</a>
      <ul class="nav-links">
        <li class="nav-group">
          <span class="nav-group-label" id="nav-weekly">Weekly</span>
          <ul aria-labelledby="nav-weekly">
            <li><a href="/start-sit/">Start/sit</a></li>
            <li><a href="/">Trade analyzer</a></li>
            <li><a href="/defense/">Defenses</a></li>
          </ul>
        </li>
        <li class="nav-group">
          <span class="nav-group-label" id="nav-players">Players</span>
          <ul aria-labelledby="nav-players">
            <li><a href="/tiers/">Tier lists</a></li>
            <li><a href="/finder/">Player finder</a></li>
          </ul>
        </li>
        <li class="nav-group">
          <span class="nav-group-label" id="nav-draft">Draft</span>
          <ul aria-labelledby="nav-draft">
            <li><a href="/draft/">Draft masterclass</a></li>
          </ul>
        </li>
        <li class="nav-group">
          <span class="nav-group-label" id="nav-leagues">My leagues</span>
          <ul aria-labelledby="nav-leagues">
            <li><a href="/team/">My team</a></li>
            <li><a href="/profile/">Profile</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </nav>

  <main class="profile" id="profile" tabindex="-1" aria-busy="true">
    <header class="profile-head">
      <div class="profile-photo" id="profile-photo" aria-hidden="true"></div>
      <div class="profile-title">
        <h1 id="profile-name">Loading player</h1>
        <p class="profile-sub" id="profile-sub"></p>
      </div>
    </header>

    <div class="profile-notice" id="profile-notice" role="status" hidden>
      <p id="profile-notice-text"></p>
      <button type="button" class="btn btn-quiet" id="profile-retry" hidden>Try again</button>
    </div>

    <ul class="profile-tags" id="profile-tags" aria-label="Player tags" hidden></ul>

    <dl class="bio-facts" id="bio-facts"></dl>

    <section class="profile-section" id="combine-section" aria-labelledby="combine-heading" hidden>
      <h2 id="combine-heading" class="section-heading">Combine</h2>
      <p class="section-note" id="combine-note"></p>
      <ul class="drills" id="combine-drills"></ul>
    </section>

    <section class="profile-section" id="nfl-section" aria-labelledby="nfl-heading" hidden>
      <h2 id="nfl-heading" class="section-heading">NFL career</h2>
      <div class="stat-view" id="nfl-stats"></div>
    </section>

    <section class="profile-section" id="college-section" aria-labelledby="college-heading" hidden>
      <h2 id="college-heading" class="section-heading">College</h2>
      <div class="stat-view" id="college-stats"></div>
    </section>

    <p class="profile-credit" id="profile-credit"></p>
  </main>

  <!-- Floats in the bottom-right corner on every page; theme.js keeps the label and icon current. -->
  <button id="theme-toggle" class="theme-toggle" type="button">
    <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" />
    </svg>
    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="4.25" />
      <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" />
    </svg>
    <span class="theme-label visually-hidden">Dark mode</span>
  </button>

  <script src="/theme.js"></script>
  <script src="/backdrop.js"></script>
  <script src="/vendor/gsap.min.js"></script>
  <script src="/vendor/lenis.min.js"></script>
  <script src="/motion.js"></script>
  <script src="/player-search.js"></script>
  <script src="/player/player.js"></script>
</body>
</html>
