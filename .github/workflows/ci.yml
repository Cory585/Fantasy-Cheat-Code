# Runs on every pull request and every push to main. Each job is a separate check, so a
# branch protection rule on main can require them all before merging (see README).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard (secrets, forbidden files, commit messages)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check the changed files and commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-list --max-parents=0 "$HEAD" | tail -1)
          fi
          python scripts/guard.py --range "$BASE..$HEAD"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # the action lists the PR's commits to know what to scan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint (ruff, JavaScript syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install "ruff>=0.15"
      - name: ruff (errors and security rules)
        working-directory: backend
        run: ruff check --output-format=github .
      - name: ruff on scripts
        run: ruff check --config backend/ruff.toml --output-format=github scripts
      - name: JavaScript parses
        run: |
          find frontend -name '*.js' -not -path 'frontend/vendor/*' -print0 | xargs -0 -n1 node --check

  test:
    name: Tests (unit, API, browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # The browser tests drive the runner's installed Chrome; they never touch the network.
      - run: python -m pytest -q -p no:cacheprovider

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install "pip-audit>=2.7"
      - name: Known vulnerabilities in the app's dependencies
        run: pip-audit -r backend/requirements.txt --progress-spinner off
